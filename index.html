<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Crypto Price">
<title>Crypto Price</title>
<style>
:root{--bg:#04080a;--panel:#0b1317;--line:#1d2b32;--txt:#f2f6f7;--mut:#8b9ba3;--g:#22e07a;--r:#ff4d4d;--p:#a78bfa}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg);color:var(--txt);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden;overscroll-behavior:none}
#app{height:100dvh;display:flex;flex-direction:column;gap:6px;padding:max(8px,env(safe-area-inset-top)) 4px max(6px,env(safe-area-inset-bottom))}
header{padding:0 6px;display:flex;align-items:center;gap:10px}
.logo{width:44px;height:44px;flex:none;border-radius:50%}
.ttl{flex:1;min-width:0}
h1{font-size:23px;line-height:1.1;font-weight:800;letter-spacing:-.3px}
h1 b{color:var(--g)}
.sub{font-size:12px;color:var(--mut);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stats{padding:0 4px;display:grid;grid-template-columns:1fr 1.15fr 1fr;gap:7px}
.card{border:1px solid var(--line);border-radius:14px;background:var(--panel);padding:8px 9px;display:flex;align-items:center;gap:8px;min-width:0}
.card svg{width:26px;height:26px;flex:none}
.card .v{font-size:17px;font-weight:800;line-height:1.1;white-space:nowrap}
.card .l{font-size:10.5px;color:var(--mut);margin-top:2px;white-space:nowrap}
.up{color:var(--g)}.dn{color:var(--r)}.nu{color:var(--p)}
.bar{padding:0 6px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.seg{flex:1;display:flex;border:1px solid var(--line);border-radius:12px;background:var(--panel);overflow:hidden}
.seg button{flex:1;background:none;border:0;color:var(--mut);font-weight:700;font-size:12.5px;padding:8px 2px;white-space:nowrap}
.seg button.on{background:#16262d;color:var(--txt);box-shadow:inset 0 -2px 0 var(--g)}
#stage{position:relative;flex:1;min-height:0;border-radius:10px;overflow:hidden;background:radial-gradient(ellipse at 50% 40%,#08141a 0%,#04080a 75%);border:1px solid #0e1a20}
#cv{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block}
#reset{position:absolute;right:8px;top:8px;display:none;background:rgba(11,19,23,.85);border:1px solid var(--line);color:var(--txt);border-radius:10px;padding:6px 10px;font-size:12px;font-weight:700}
#bd{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;z-index:20}
#info{position:fixed;inset:0;margin:auto;width:min(92vw,380px);height:fit-content;z-index:21;display:none;background:rgba(11,19,23,.94);border:1px solid var(--line);border-radius:14px;padding:14px 14px 16px;box-shadow:0 10px 40px rgba(0,0,0,.7);touch-action:none;transition:transform .22s ease}
#info.drag{transition:none}
#grab{width:38px;height:4px;border-radius:3px;background:#2c3d46;margin:-4px auto 8px}
#info .t{display:flex;align-items:center;gap:10px}
#info .more{display:block;margin-top:10px;border-top:1px solid var(--line);padding-top:9px;font-size:12px;color:var(--mut)}
#info .more p{display:flex;justify-content:space-between;padding:4px 0}
#info .more p b{color:var(--txt)}
#info img,#info .ph{width:36px;height:36px;border-radius:50%;flex:none;background:#fff}
#info .ph{display:grid;place-items:center;color:#000;font-weight:800;font-size:12px}
#info .n{font-weight:800;font-size:15px;min-width:0}
#info .n small{color:var(--mut);font-weight:600;margin-left:5px;font-size:11px}
#info .pr{margin-left:auto;text-align:right;font-weight:800;font-size:15px}
#info .pr small{display:block;font-size:11px;font-weight:700}
#info .row{display:flex;gap:6px;margin-top:9px;font-size:11.5px}
#info .row div{flex:1;background:#101c22;border-radius:9px;padding:5px 7px;color:var(--mut)}
#info .row b{display:block;font-size:13px;margin-top:1px}
#info a{display:block;margin-top:8px;color:var(--g);font-size:12px;text-decoration:none;font-weight:700}
#x{position:absolute;right:8px;top:6px;background:none;border:0;color:var(--mut);font-size:18px;padding:2px 6px}
.legend{display:flex;justify-content:center}
.legend div{display:flex;border:1px solid var(--line);border-radius:14px;background:var(--panel);padding:4px 2px}
.legend span{display:flex;align-items:center;gap:5px;font-size:10px;padding:0 10px;border-left:1px solid var(--line)}
.legend span:first-child{border:0}
.legend i{width:9px;height:9px;border-radius:50%}
.legend em{font-style:normal;color:var(--mut);font-size:9px}
@media (max-height:700px){.legend{display:none}}
</style>
</head>
<body>
<div id="app">
  <header>
    <svg class="logo" viewBox="0 0 44 44"><circle cx="22" cy="22" r="21" fill="#000" stroke="#1d2b32" stroke-width="1"/><circle cx="19" cy="20" r="9" fill="#22e07a"/><circle cx="31" cy="14" r="5" fill="#ff4d4d"/><circle cx="30" cy="30" r="7" fill="#a78bfa"/><circle cx="13" cy="33" r="4" fill="#ff4d4d"/></svg>
    <div class="ttl"><h1>Crypto <b>Price</b></h1><div class="sub" id="sub">Memuat data CoinGecko…</div></div>
  </header>

  <div class="stats">
    <div class="card"><svg viewBox="0 0 24 24" fill="none" stroke="#fbbf24" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><path d="M9 8h5a2 2 0 010 4H9m0 0h5.5a2 2 0 010 4H9M9 6v12M12 5v2M12 17v2"/></svg><div><div class="v" id="sCoins">–</div><div class="l">Total Koin</div></div></div>
    <div class="card"><svg viewBox="0 0 24 24" fill="#22e07a"><rect x="3" y="14" width="4" height="7" rx="1"/><rect x="10" y="10" width="4" height="11" rx="1"/><rect x="17" y="5" width="4" height="16" rx="1"/></svg><div><div class="v" id="sCap">–</div><div class="l">Market Cap</div></div></div>
    <div class="card"><svg id="sArr" viewBox="0 0 24 24" fill="#22e07a"><path d="M12 4l9 15H3z"/></svg><div><div class="v up" id="sChg">–</div><div class="l">Rata-rata 24 Jam</div></div></div>
  </div>

  <div class="bar"><div class="seg" id="seg"><button data-s="pop" class="on">Populer</button><button data-s="gain">Gainer</button><button data-s="loss">Loser</button><button data-s="vol">Volatil</button></div></div>

  <div id="stage">
    <canvas id="cv"></canvas>
    <button id="reset">⟲ Reset</button>
    <div id="bd"></div>
    <div id="info"><div id="grab"></div><button id="x">×</button><div id="infoIn"></div></div>
  </div>

  <div class="legend"><div>
    <span><i style="background:var(--g)"></i>Naik <em id="nG">0</em></span>
    <span><i style="background:var(--r)"></i>Turun <em id="nR">0</em></span>
    <span><i style="background:var(--p)"></i>Netral <em id="nP">0</em></span>
  </div></div>
</div>

<script>
(function(){
'use strict';
/* ====== PENGATURAN ====== */
const API='https://api.coingecko.com/api/v3/coins/markets?vs_currency=usd&order=market_cap_desc&per_page=250&sparkline=false&price_change_percentage=1h,24h,7d&page=';
const PAGES=4;               /* 4 x 250 = 1000 koin */
const NEUTRAL=0.1;           /* % */
const REFRESH_MS=90000;      /* batas rate-limit CoinGecko gratis */
const CACHE_KEY='cg_cache1';

const COL={g:[34,224,122],r:[255,77,77],p:[167,139,250]};
const tf='24h';
let sortBy='pop';
const DPR=Math.min(window.devicePixelRatio||1,2.5);
const $=id=>document.getElementById(id);
const stage=$('stage'),cv=$('cv'),ctx=cv.getContext('2d');
const coins=[];const byId=new Map();let list=[];let demo=false;
let W=0,H=0;const view={k:1,x:0,y:0};let selected=null;
let lastT=0,isLive=false,progress='';

/* ====== FORMAT ====== */
const fmtP=p=>{if(p==null||!isFinite(p))return'-';const a=Math.abs(p),d=a>=1000?2:a>=1?4:a>=.01?6:a>=.0001?8:10;return '$'+p.toLocaleString('en-US',{minimumFractionDigits:d>4?Math.min(d,6):d,maximumFractionDigits:d});};
const fmtBig=v=>{if(v==null||!isFinite(v))return'-';const a=Math.abs(v);if(a>=1e12)return '$'+(v/1e12).toFixed(2)+'T';if(a>=1e9)return '$'+(v/1e9).toFixed(2)+'B';if(a>=1e6)return '$'+(v/1e6).toFixed(2)+'M';return '$'+Math.round(v).toLocaleString('en-US');};
const fmtN=v=>{if(v==null||!isFinite(v))return'-';const a=Math.abs(v);if(a>=1e12)return (v/1e12).toFixed(2)+'T';if(a>=1e9)return (v/1e9).toFixed(2)+'B';if(a>=1e6)return (v/1e6).toFixed(2)+'M';return Math.round(v).toLocaleString('en-US');};
const fmtC=v=>(v==null||!isFinite(v))?'-':(v>0?'+':'')+v.toFixed(2)+'%';
const clsOfV=v=>v>NEUTRAL?'g':v<-NEUTRAL?'r':'p';
const chg=c=>c.ch[tf]||0;
const cls=c=>clsOfV(chg(c));
const css=k=>k==='g'?'up':k==='r'?'dn':'nu';
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const esc=s=>String(s).replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));

/* ====== PENYIMPANAN (IndexedDB): data + logo disimpan -> buka app langsung penuh ====== */
const tex={},maps={};
const DB={db:null,
  open(){return new Promise(res=>{try{const r=indexedDB.open('crypto-cloud',1);r.onupgradeneeded=()=>{r.result.createObjectStore('kv');};r.onsuccess=()=>{DB.db=r.result;res(true);};r.onerror=()=>res(false);r.onblocked=()=>res(false);}catch(e){res(false);}});},
  get(k){return new Promise(res=>{if(!DB.db)return res(null);try{const rq=DB.db.transaction('kv').objectStore('kv').get(k);rq.onsuccess=()=>res(rq.result===undefined?null:rq.result);rq.onerror=()=>res(null);}catch(e){res(null);}});},
  set(k,v){if(!DB.db)return;try{DB.db.transaction('kv','readwrite').objectStore('kv').put(v,k);}catch(e){}}
};

/* ====== LOGO KOIN (cache di IndexedDB, unduh bertahap sesuai market cap) ====== */
const imgs={},imgReq={};let lq=[],lact=0;
function setLogo(id,im){imgs[id]=im;delete tex[id];}
function loadLogosFromDB(){
  return new Promise(res=>{
    if(!DB.db)return res();
    const pend=[];
    try{
      const rq=DB.db.transaction('kv','readonly').objectStore('kv').openCursor(IDBKeyRange.bound('l:','l:\uffff'));
      rq.onsuccess=()=>{
        const cur=rq.result;
        if(cur){
          const id=String(cur.key).slice(2),u=cur.value;
          pend.push(new Promise(r=>{const im=new Image();im.onload=()=>{setLogo(id,im);r();};im.onerror=()=>r();im.src=u;}));
          cur.continue();
        }else Promise.all(pend).then(()=>res());
      };
      rq.onerror=()=>res();
    }catch(e){res();}
  });
}
function fetchLogo(c){
  return new Promise(res=>{
    const big=(c.rank||9999)<=100;
    const url=big?c.image:c.image.replace('/large/','/small/');
    const im=new Image();im.crossOrigin='anonymous';
    im.onload=()=>{
      try{
        const S=big?112:64,cn=document.createElement('canvas');cn.width=cn.height=S;
        cn.getContext('2d').drawImage(im,0,0,S,S);
        const u=cn.toDataURL('image/png');
        DB.set('l:'+c.id,u);
        const i2=new Image();i2.onload=()=>{setLogo(c.id,i2);res();};i2.onerror=()=>{setLogo(c.id,im);res();};i2.src=u;
        return;
      }catch(e){}
      setLogo(c.id,im);res();
    };
    im.onerror=()=>{const i3=new Image();i3.onload=()=>{setLogo(c.id,i3);res();};i3.onerror=()=>res();i3.src=url;};
    im.src=url;
  });
}
function queueLogos(){coins.forEach(c=>{if(c.image&&!imgs[c.id]&&!imgReq[c.id]){imgReq[c.id]=1;lq.push(c);}});pumpLogos();}
function pumpLogos(){
  while(lact<10&&lq.length){
    const c=lq.shift();lact++;
    fetchLogo(c).then(()=>{lact--;pumpLogos();});
  }
}

/* ====== DATA ====== */
function norm(d){
  const n=v=>(v==null||!isFinite(v))?null:v;
  return{id:d.id,sym:String(d.symbol||'').toUpperCase(),name:d.name,image:d.image,price:n(d.current_price),mc:n(d.market_cap)||0,rank:d.market_cap_rank,
    vol:n(d.total_volume),hi:n(d.high_24h),lo:n(d.low_24h),
    ch24:n(d.price_change_percentage_24h_in_currency!=null?d.price_change_percentage_24h_in_currency:d.price_change_percentage_24h),
    ch1:n(d.price_change_percentage_1h_in_currency),ch7:n(d.price_change_percentage_7d_in_currency),
    ath:n(d.ath),athc:n(d.ath_change_percentage),circ:n(d.circulating_supply)};
}
function ingest(arr,skipLogos){
  arr.forEach(d=>{
    let c=byId.get(d.id);
    if(!c){c={id:d.id,vx:0,vy:0,free:false,st:0,x:null,y:null,r:0,tx:null,ty:null,tr:0,ph:Math.random()*6.28,fr:.6+Math.random()*.8,sp:null};byId.set(d.id,c);coins.push(c);}
    c.raw=d;c.sym=d.sym;c.cname=d.name;c.image=d.image;c.price=d.price;c.mc=d.mc;c.vol=d.vol;c.hi=d.hi;c.lo=d.lo;
    c.ath=d.ath;c.athc=d.athc;c.circ=d.circ;c.score=d.mc||1;c.rank=d.rank;
    c.ch={'24h':d.ch24==null?0:d.ch24,'1h':d.ch1,'7d':d.ch7};
  });
  coins.sort((a,b)=>b.score-a.score);
  if(!skipLogos)queueLogos();
}
async function fetchPage(p){
  for(let t=0;t<3;t++){
    try{
      const r=await fetch(API+p,{cache:'no-store'});
      if(r.status===429){await sleep(8000*(t+1));continue;}
      if(!r.ok)throw 0;
      const j=await r.json();if(Array.isArray(j))return j;
    }catch(e){await sleep(1500);}
  }
  return null;
}
let loading=false;
function saveCache(){if(demo)return;DB.set('data',{t:lastT,d:coins.map(c=>c.raw)});}
async function load(){
  if(loading)return;loading=true;
  let got=0;
  for(let p=1;p<=PAGES;p++){
    progress=(!coins.length||demo)?'Memuat '+((p-1)*250)+'/'+(PAGES*250)+'… ':'Memperbarui… ';
    refreshUI();
    const j=await fetchPage(p);
    if(!j||!j.length)break;
    if(demo){coins.length=0;byId.clear();list=[];demo=false;}
    ingest(j.map(norm));got+=j.length;isLive=true;lastT=Date.now();
    relayout();refreshUI();saveCache();
    if(p<PAGES)await sleep(1300);
  }
  progress='';
  if(!got&&!coins.length)useDemo();
  refreshUI();
  loading=false;
}
function useDemo(){
  demo=true;let s=7;const rnd=()=>{s=(s*16807)%2147483647;return s/2147483647;};
  const a=[];for(let i=0;i<300;i++){a.push({id:'demo'+i,sym:'C'+(i+1),name:'Coin '+(i+1),image:null,price:rnd()*100,mc:1e12/Math.pow(i+1,1.6),rank:i+1,vol:1e8*rnd(),hi:null,lo:null,ch24:(rnd()-.5)*12,ch1:null,ch7:null,ath:null,athc:null,circ:null});}
  ingest(a,true);relayout();refreshUI();
}

/* ====== LAYOUT (packing gelembung) ====== */
function relayout(){
  if(!W||!coins.length)return;
  const L=coins.slice();let area=0;
  if(sortBy==='pop'){
    let mn=1e30,mx=-1e30;L.forEach(c=>{c.lg=Math.log(Math.max(1,c.score));if(c.lg<mn)mn=c.lg;if(c.lg>mx)mx=c.lg;});
    L.forEach(c=>{const n=(c.lg-mn)/Math.max(.001,mx-mn);c.w=.35+1.5*Math.pow(n,2.1);});
  }else if(sortBy==='vol'){
    const vals=L.map(c=>Math.abs(chg(c))).sort((a,b)=>a-b);
    const cap=Math.max(.5,vals[Math.floor(vals.length*.95)]||1);
    L.forEach(c=>{const v=Math.min(Math.abs(chg(c)),cap)/cap;c.w=.4+1.3*Math.pow(v,.65);});
  }else{
    const sg=sortBy==='gain'?1:-1,val=c=>Math.max(0,chg(c)*sg);
    const vals=L.map(val).filter(v=>v>0).sort((a,b)=>a-b);
    const cap=Math.max(.5,vals[Math.floor(vals.length*.95)]||1);
    L.forEach(c=>{const v=Math.min(val(c),cap)/cap;c.w=.4+1.3*Math.pow(v,.65);});
  }
  L.forEach(c=>{area+=Math.PI*c.w*c.w;});
  const s=Math.sqrt(.62*W*H/area);
  L.forEach(c=>{c.tr=c.w*s;if(c.tx==null){c.tx=Math.random()*W;c.ty=Math.random()*H;}});
  const n=L.length;let rmax=0;L.forEach(c=>{if(c.tr>rmax)rmax=c.tr;});
  const cell=Math.max(8,rmax*2+1),cols=Math.ceil(W/cell)+1,rows=Math.ceil(H/cell)+1;
  const head=new Int32Array(cols*rows),next=new Int32Array(n);
  for(let it=0;it<200;it++){
    head.fill(-1);
    for(let i=0;i<n;i++){const c=L[i];const g=Math.floor(c.tx/cell)+Math.floor(c.ty/cell)*cols;next[i]=head[g];head[g]=i;}
    let worst=0;
    for(let i=0;i<n;i++){
      const a=L[i],gx=Math.floor(a.tx/cell),gy=Math.floor(a.ty/cell);
      for(let oy=-1;oy<=1;oy++)for(let ox=-1;ox<=1;ox++){
        const X=gx+ox,Y=gy+oy;if(X<0||Y<0||X>=cols||Y>=rows)continue;
        for(let j=head[X+Y*cols];j>=0;j=next[j]){
          if(j<=i)continue;const b=L[j];
          let dx=b.tx-a.tx,dy=b.ty-a.ty,d=Math.hypot(dx,dy),m=a.tr+b.tr+.6;
          if(d<m){
            if(d<.001){dx=Math.random()-.5;dy=Math.random()-.5;d=Math.hypot(dx,dy);}
            const o=m-d;if(o>worst)worst=o;
            const ra=b.tr*b.tr/(a.tr*a.tr+b.tr*b.tr),rb=1-ra,ux=dx/d,uy=dy/d;
            a.tx-=ux*o*ra*.9;a.ty-=uy*o*ra*.9;b.tx+=ux*o*rb*.9;b.ty+=uy*o*rb*.9;
          }
        }
      }
    }
    for(let i=0;i<n;i++){const c=L[i];c.tx=clamp(c.tx,c.tr+1,W-c.tr-1);c.ty=clamp(c.ty,c.tr+1,H-c.tr-1);}
    if(it>25&&worst<.05)break;
  }
  L.forEach(c=>{if(c.x==null){c.x=c.tx;c.y=c.ty;c.r=c.tr;}});
  list=L.slice().sort((a,b)=>b.tr-a.tr);
}

/* ====== SPRITE GELEMBUNG: logo koin membungkus penuh, dipetakan ke bola 3D ====== */
const modeOf=c=>2;   /* 2=simbol+%, 1=%, 0=logo saja */
/* warna latar koin = warna cincin tepi logo (supaya bola tertutup penuh walau logo transparan) */
function edgeColor(d,N){
  const h=N/2;let r=0,g=0,b=0,n=0;
  for(let y=0;y<N;y++)for(let x=0;x<N;x++){
    const i=(y*N+x)*4;if(d[i+3]<200)continue;
    const dd=Math.hypot(x+.5-h,y+.5-h)/h;
    if(dd>.7&&dd<1){r+=d[i];g+=d[i+1];b+=d[i+2];n++;}
  }
  return n>12?[r/n|0,g/n|0,b/n|0]:null;
}
function getTex(c){
  const t=tex[c.id];if(t!==undefined)return t||null;
  const im=imgs[c.id],TWd=(c.rank||9999)<=100?128:64,col=COL[cls(c)];
  try{
    const cn=document.createElement('canvas');cn.width=cn.height=TWd;const g=cn.getContext('2d');
    let bg=null;
    if(im){const sc=document.createElement('canvas');sc.width=sc.height=32;const sg=sc.getContext('2d');sg.drawImage(im,0,0,32,32);bg=edgeColor(sg.getImageData(0,0,32,32).data,32);}
    const f=bg||col.map(v=>(im?v*.3:v*.5)|0);
    g.fillStyle='rgb('+f.join(',')+')';g.fillRect(0,0,TWd,TWd);
    if(im)g.drawImage(im,0,0,TWd,TWd);
    else{g.fillStyle='#fff';g.textAlign='center';g.textBaseline='middle';g.font='800 '+Math.round(TWd*.3)+'px system-ui,sans-serif';g.fillText(c.sym.slice(0,4),TWd/2,TWd/2);}
    return tex[c.id]={d:g.getImageData(0,0,TWd,TWd).data,w:TWd};
  }catch(e){tex[c.id]=0;return null;}
}
function getMap(T){
  if(maps[T])return maps[T];
  const R=(T-4)/2,m=T/2,n=T*T,U=new Float32Array(n),V=new Float32Array(n),sh=new Uint8Array(n),sp=new Uint8Array(n),al=new Uint8Array(n);
  for(let y=0;y<T;y++)for(let x=0;x<T;x++){
    const i=y*T+x,nx=(x+.5-m)/R,ny=(y+.5-m)/R,r2=nx*nx+ny*ny;
    if(r2>=1.05)continue;
    const r=Math.sqrt(r2),z=r2<1?Math.sqrt(1-r2):0;
    const a=Math.max(0,Math.min(1,(1-r)*R));if(a<=0)continue;
    /* lensa bola: logo sedikit menggembung di tengah & merapat di tepi */
    const ss=r>1e-4?Math.asin(Math.min(1,r))/(Math.PI/2)/r:.64,s=.5*(1+ss);
    U[i]=.5+nx*s*.5;V[i]=.5+ny*s*.5;
    const dot=Math.max(0,-.35*nx-.4*ny+.85*z);
    sh[i]=Math.round(Math.min(1.9,(.42+.68*dot)*(.62+.38*Math.pow(z,.6)))*128);
    sp[i]=Math.round(Math.pow(dot,26)*95);
    al[i]=Math.round(a*255);
  }
  return maps[T]={U,V,sh,sp,al};
}
function drawSphere(g,T,tx,TWd,dim){
  const mp=getMap(T),out=g.createImageData(T,T),o=out.data,n=T*T,w1=TWd-1;
  for(let i=0;i<n;i++){
    const a=mp.al[i];if(!a)continue;
    const s=mp.sh[i]/128*dim,e=mp.sp[i],j=i*4;
    const fx=Math.min(w1,Math.max(0,mp.U[i]*w1)),fy=Math.min(w1,Math.max(0,mp.V[i]*w1));
    const x0=Math.min(w1-1,fx|0),y0=Math.min(w1-1,fy|0),ax=fx-x0,ay=fy-y0;
    const q=(y0*TWd+x0)*4,q1=q+4,q2=q+TWd*4,q3=q2+4;
    for(let c=0;c<3;c++){
      const v=(tx[q+c]*(1-ax)+tx[q1+c]*ax)*(1-ay)+(tx[q2+c]*(1-ax)+tx[q3+c]*ax)*ay;
      o[j+c]=Math.min(255,v*s+e);
    }
    o[j+3]=a;
  }
  g.putImageData(out,0,0);
}
function mkSprite(c){
  const k=cls(c),col=COL[k];
  const S=Math.max(72,Math.round(clamp(c.tr*2*DPR*2.4,72,192)/8)*8),T=S+4,m=T/2,R=S/2;
  const cn=document.createElement('canvas');cn.width=cn.height=T;const g=cn.getContext('2d');
  const img=imgs[c.id],ch=chg(c),ctxt=(ch>0?'+':'')+ch.toFixed(Math.abs(ch)>=100?0:Math.abs(ch)>=10?1:2)+'%';
  const tc=k==='g'?'#8dffb8':k==='r'?'#ff9d9d':'#ddd0ff';
  const mode=modeOf(c);
  const tx=getTex(c);
  if(tx)drawSphere(g,T,tx.d,tx.w,mode?.82:1);
  else{
    g.save();g.beginPath();g.arc(m,m,R,0,7);g.clip();
    g.fillStyle='rgb('+col.map(v=>v*.35|0).join(',')+')';g.fillRect(0,0,T,T);
    if(img){try{g.drawImage(img,m-R,m-R,2*R,2*R);}catch(e){}}
    const sh=g.createRadialGradient(m-R*.3,m-R*.35,R*.1,m,m,R);
    sh.addColorStop(0,'rgba(255,255,255,.28)');sh.addColorStop(.55,'rgba(0,0,0,0)');sh.addColorStop(1,'rgba(0,0,0,.5)');
    g.fillStyle=sh;g.fillRect(0,0,T,T);
    if(mode){g.fillStyle='rgba(0,0,0,.18)';g.fillRect(0,0,T,T);}
    g.restore();
  }
  if(mode){
    g.textAlign='center';g.textBaseline='middle';g.lineJoin='round';
    const put=(txt,f,y,color,maxW)=>{g.font='800 '+f+'px system-ui,sans-serif';const w=g.measureText(txt).width;if(w>maxW){f*=maxW/w;g.font='800 '+f+'px system-ui,sans-serif';}
      g.lineWidth=Math.max(1.5,f*.22);g.strokeStyle='rgba(0,0,0,.9)';g.strokeText(txt,m,y);g.fillStyle=color;g.fillText(txt,m,y);};
    put(c.sym,R*.3,m+R*.14,'#fff',R*1.5);put(ctxt,R*.27,m+R*.5,tc,R*1.5);
  }
  c.sp=cn;c.spS=S;c.spT=T;c.spR=c.tr;c.spK=k;c.spImg=!!img;c.spMode=mode;c.spTx=ch;
}

/* ====== RENDER ====== */
let prevT=0;
function frame(t){
  requestAnimationFrame(frame);
  if(document.hidden||!W){prevT=t;return;}
  const dt=clamp((t-(prevT||t))/16.67,.5,3);prevT=t;physics(dt);
  ctx.setTransform(DPR,0,0,DPR,0,0);ctx.clearRect(0,0,W,H);
  ctx.translate(view.x,view.y);ctx.scale(view.k,view.k);
  const vx0=-view.x/view.k,vy0=-view.y/view.k,vx1=vx0+W/view.k,vy1=vy0+H/view.k;
  const tb=performance.now();
  for(let i=0;i<list.length;i++){
    const c=list[i];
    if(c.r<.25)continue;
    const pad=c.r*1.9;
    if(c.x+pad<vx0||c.x-pad>vx1||c.y+pad<vy0||c.y-pad>vy1)continue;
    if((!c.sp||c.spK!==cls(c)||c.spImg!==!!imgs[c.id]||c.spMode!==modeOf(c)||(c.spMode&&c.spTx!==chg(c))||Math.abs(c.tr-c.spR)>c.spR*.3)&&Math.abs(c.tr-c.r)<c.tr*.12+.3&&performance.now()-tb<10){mkSprite(c);}
    if(!c.sp)continue;
    const a=Math.min(1.1,c.r*.12),dx=Math.sin(t*.0006*c.fr+c.ph)*a,dy=Math.cos(t*.0005*c.fr+c.ph*1.3)*a;
    const k=2*c.r/c.spS,w=c.spT*k;
    ctx.drawImage(c.sp,c.x+dx-w/2,c.y+dy-w/2,w,w);
  }
  if(selected){
    ctx.strokeStyle='rgba(255,255,255,.9)';ctx.lineWidth=.8/view.k;ctx.beginPath();ctx.arc(selected.x,selected.y,selected.r+1.5/view.k,0,7);ctx.stroke();
  }
}

/* ====== UI ====== */
function hhmm(t){const d=new Date(t);return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')+':'+String(d.getSeconds()).padStart(2,'0');}
function refreshUI(){
  const L=coins;
  $('sCoins').textContent=L.length.toLocaleString('id-ID');
  let ws=0,wt=0,ng=0,nr=0,np=0,tm=0;
  L.forEach(c=>{ws+=c.score*chg(c);wt+=c.score;tm+=c.mc||0;const k=cls(c);k==='g'?ng++:k==='r'?nr++:np++;});
  $('sCap').textContent=demo?'–':fmtBig(tm);
  $('sub').textContent=demo?'Data demo • CoinGecko belum dapat diakses':progress+L.length+' Koin • CoinGecko • '+(isLive?'Live ':'Cache ')+(lastT?hhmm(lastT):'');
  const wc=wt?ws/wt:0,k=clsOfV(wc);
  const e=$('sChg');e.textContent=fmtC(wc);e.className='v '+css(k);
  const ar=$('sArr');ar.setAttribute('fill',k==='r'?'#ff4d4d':k==='p'?'#a78bfa':'#22e07a');
  ar.innerHTML=k==='r'?'<path d="M12 20L3 5h18z"/>':'<path d="M12 4l9 15H3z"/>';
  $('nG').textContent=ng;$('nR').textContent=nr;$('nP').textContent=np;
  if(selected&&$('info').style.display==='block')showInfo(selected,true);
}
let shownAt=0;
function showInfo(c,silent){
  if(!silent)shownAt=performance.now();selected=c;const box=$('info'),in_=$('infoIn');
  const chip=(l,v)=>'<div>'+l+'<b class="'+(v==null?'':css(clsOfV(v)))+'">'+fmtC(v)+'</b></div>';
  const val=(l,v)=>'<div>'+l+'<b style="color:var(--txt)">'+fmtP(v)+'</b></div>';
  const range=(c.hi!=null&&c.lo)?((c.hi-c.lo)/c.lo*100).toFixed(2)+'%':'-';
  const logo=c.image?'<img alt="" src="'+esc((imgs[c.id]&&imgs[c.id].src)||c.image)+'">':'<div class="ph">'+esc(c.sym.slice(0,3))+'</div>';
  in_.innerHTML='<div class="t">'+logo+'<div class="n"><span id="iN"></span><small id="iS"></small></div><div class="pr">'+fmtP(c.price)+'<small class="'+css(cls(c))+'">'+fmtC(chg(c))+'</small></div></div>'
   +'<div class="row">'+chip('1 jam',c.ch['1h'])+chip('24 jam',c.ch['24h'])+chip('7 hari',c.ch['7d'])+'</div>'
   +'<div class="row">'+val('High 24j',c.hi)+val('Low 24j',c.lo)+'</div>'
   +'<div class="more"><p><span>Peringkat</span><b>#'+(c.rank||'-')+'</b></p><p><span>Market Cap</span><b>'+fmtBig(c.mc)+'</b></p><p><span>Volume 24j</span><b>'+fmtBig(c.vol)+'</b></p><p><span>Rentang 24j</span><b>'+range+'</b></p><p><span>ATH</span><b>'+fmtP(c.ath)+' ('+fmtC(c.athc)+')</b></p><p><span>Suplai beredar</span><b>'+fmtN(c.circ)+' '+esc(c.sym)+'</b></p></div>'
   +'<a target="_blank" rel="noopener" href="https://www.coingecko.com/en/coins/'+encodeURIComponent(c.id)+'">Buka di CoinGecko ↗</a>';
  $('iN').textContent=c.cname;$('iS').textContent=c.sym;
  box.style.display='block';$('bd').style.display='block';
}
function hideInfo(){selected=null;const b=$('info');b.style.display='none';$('bd').style.display='none';b.style.transform='';}
$('bd').addEventListener('click',e=>{e.stopPropagation();if(performance.now()-shownAt>450)hideInfo();});
$('bd').addEventListener('pointerdown',e=>e.stopPropagation());
(function(){
  const box=$('info');let y0=null,dy=0;
  box.addEventListener('pointerdown',e=>{if(e.target.closest('a,#x'))return;y0=e.clientY;dy=0;box.classList.add('drag');});
  window.addEventListener('pointermove',e=>{if(y0==null)return;dy=e.clientY-y0;box.style.transform='translateY('+Math.max(0,dy)+'px)';});
  function end(){if(y0==null)return;y0=null;box.classList.remove('drag');box.style.transform='';if(dy>60)hideInfo();dy=0;}
  window.addEventListener('pointerup',end);window.addEventListener('pointercancel',end);
})();
$('x').onclick=e=>{e.stopPropagation();hideInfo();};
$('seg').onclick=e=>{
  const b=e.target.closest('button');if(!b||b.dataset.s===sortBy)return;
  sortBy=b.dataset.s;[...$('seg').children].forEach(x=>x.classList.toggle('on',x===b));
  coins.forEach(c=>{c.free=false;c.vx=c.vy=0;});relayout();refreshUI();
};

/* ====== ZOOM / PAN / TAP ====== */
function clampView(){view.x=clamp(view.x,W-W*view.k,0);view.y=clamp(view.y,H-H*view.k,0);$('reset').style.display=view.k>1.02?'block':'none';}
function zoomAt(cx,cy,nk){nk=clamp(nk,1,12);const wx=(cx-view.x)/view.k,wy=(cy-view.y)/view.k;view.k=nk;view.x=cx-wx*nk;view.y=cy-wy*nk;clampView();}
$('reset').onclick=()=>{view.k=1;view.x=view.y=0;clampView();};
cv.addEventListener('wheel',e=>{e.preventDefault();zoomAt(e.offsetX,e.offsetY,view.k*(e.deltaY<0?1.18:1/1.18));},{passive:false});
const ptrs=new Map();let drag=null,pinch=null,moved=0,gest=false;
let held=null,hoff=null,hist=[],holdMoved=false,sx=0,sy=0;
const pd=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
const toW=(px,py)=>({x:(px-view.x)/view.k,y:(py-view.y)/view.k});
function hit(px,py){
  const w=toW(px,py);let best=null,bs=1e9;
  for(const c of list){const rr=Math.max(c.r,7/view.k),d=Math.hypot(c.x-w.x,c.y-w.y);if(d<=rr){const sc=d/rr;if(sc<bs){bs=sc;best=c;}}}
  return best;
}
cv.addEventListener('pointerdown',e=>{
  cv.setPointerCapture(e.pointerId);ptrs.set(e.pointerId,{x:e.offsetX,y:e.offsetY});
  if(ptrs.size===1){
    moved=0;gest=false;holdMoved=false;sx=e.offsetX;sy=e.offsetY;
    const b=$('info').style.display==='block'?null:hit(e.offsetX,e.offsetY);
    if(b){const w=toW(e.offsetX,e.offsetY);held=b;hoff={x:b.x-w.x,y:b.y-w.y};hist=[{t:performance.now(),x:w.x,y:w.y}];drag=null;}
    else{held=null;drag={x:e.offsetX,y:e.offsetY,vx:view.x,vy:view.y};}
  }else if(ptrs.size===2){gest=true;drag=null;held=null;const [a,b]=[...ptrs.values()];pinch={d:pd(a,b),k:view.k};}
});
cv.addEventListener('pointermove',e=>{
  if(!ptrs.has(e.pointerId))return;ptrs.set(e.pointerId,{x:e.offsetX,y:e.offsetY});
  if(ptrs.size===2&&pinch){const [a,b]=[...ptrs.values()];zoomAt((a.x+b.x)/2,(a.y+b.y)/2,pinch.k*pd(a,b)/pinch.d);}
  else if(held){
    moved=Math.max(moved,Math.hypot(e.offsetX-sx,e.offsetY-sy));
    if(moved>=6){
      holdMoved=true;held.free=true;
      const w=toW(e.offsetX,e.offsetY),now=performance.now();
      held.x=clamp(w.x+hoff.x,held.r,W-held.r);held.y=clamp(w.y+hoff.y,held.r,H-held.r);
      hist.push({t:now,x:w.x,y:w.y});while(hist.length>2&&now-hist[0].t>100)hist.shift();
      if(hist.length>=2){const f=hist[0],l=hist[hist.length-1],dt=Math.max(8,l.t-f.t);held.vx=(l.x-f.x)/dt*16.7;held.vy=(l.y-f.y)/dt*16.7;}
    }
  }
  else if(drag){const dx=e.offsetX-drag.x,dy=e.offsetY-drag.y;moved+=Math.abs(e.movementX||0)+Math.abs(e.movementY||0);view.x=drag.vx+dx;view.y=drag.vy+dy;clampView();}
});
function up(e){
  if(!ptrs.has(e.pointerId))return;
  const wasTap=ptrs.size===1&&!gest&&moved<8&&e.type==='pointerup';
  ptrs.delete(e.pointerId);
  if(held){
    const b=held;held=null;
    if(holdMoved){
      let vx=0,vy=0;const now=performance.now();
      if(hist.length>=2&&now-hist[hist.length-1].t<90){const f=hist[0],l=hist[hist.length-1],dt=Math.max(8,l.t-f.t);vx=(l.x-f.x)/dt*16.7;vy=(l.y-f.y)/dt*16.7;}
      const sp=Math.hypot(vx,vy),mx=45;if(sp>mx){vx*=mx/sp;vy*=mx/sp;}
      b.vx=vx;b.vy=vy;b.free=true;b.st=0;
    }else if(wasTap)tap(e.offsetX,e.offsetY);
  }else if(wasTap)tap(e.offsetX,e.offsetY);
  if(ptrs.size<2)pinch=null;
  if(ptrs.size===1&&!held){const p=[...ptrs.values()][0];drag={x:p.x,y:p.y,vx:view.x,vy:view.y};}else drag=null;
}
cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',up);
function tap(px,py){
  if($('info').style.display==='block')return;
  const b=hit(px,py);b?showInfo(b):hideInfo();
}

/* ====== FISIKA: geser & lempar gelembung ====== */
function physics(dt){
  const n=list.length,hm=h=>h===held&&holdMoved;
  for(let i=0;i<n;i++){
    const c=list[i];c.r+=(c.tr-c.r)*.16;
    if(hm(c)){const f=Math.pow(.8,dt);c.vx*=f;c.vy*=f;continue;}
    if(c.free){
      c.x+=c.vx*dt;c.y+=c.vy*dt;const f=Math.pow(.985,dt);c.vx*=f;c.vy*=f;
      if(c.x<c.r){c.x=c.r;c.vx=Math.abs(c.vx)*.8;}else if(c.x>W-c.r){c.x=W-c.r;c.vx=-Math.abs(c.vx)*.8;}
      if(c.y<c.r){c.y=c.r;c.vy=Math.abs(c.vy)*.8;}else if(c.y>H-c.r){c.y=H-c.r;c.vy=-Math.abs(c.vy)*.8;}
    }else{c.x+=(c.tx-c.x)*.16;c.y+=(c.ty-c.y)*.16;}
  }
  for(let i=0;i<n;i++){
    const a=list[i],aAct=a.free||hm(a);if(!aAct)continue;
    for(let j=0;j<n;j++){
      if(j===i)continue;const b=list[j],bAct=b.free||hm(b);
      if(bAct&&j<i)continue;
      const dx=b.x-a.x,dy=b.y-a.y,m=a.r+b.r;
      if(Math.abs(dx)>m||Math.abs(dy)>m)continue;
      const d=Math.hypot(dx,dy);if(d>=m||d<.001)continue;
      const nx=dx/d,ny=dy/d,o=m-d;
      const ia=hm(a)?0:1/(a.r*a.r),ib=hm(b)?0:1/(b.r*b.r),is=ia+ib;if(!is)continue;
      a.x-=nx*o*ia/is;a.y-=ny*o*ia/is;b.x+=nx*o*ib/is;b.y+=ny*o*ib/is;
      const vn=(b.vx-a.vx)*nx+(b.vy-a.vy)*ny;
      if(vn<0){const jj=-(1+.7)*vn/is;a.vx-=jj*ia*nx;a.vy-=jj*ia*ny;b.vx+=jj*ib*nx;b.vy+=jj*ib*ny;}
      if(!b.free&&!hm(b)){b.free=true;b.st=0;}
      if(!a.free&&!hm(a)){a.free=true;a.st=0;}
    }
  }
  for(let i=0;i<n;i++){
    const c=list[i];if(!c.free||hm(c))continue;
    if(Math.hypot(c.vx,c.vy)<.08){if(++c.st>25){c.free=false;c.tx=clamp(c.x,c.tr+1,W-c.tr-1);c.ty=clamp(c.y,c.tr+1,H-c.tr-1);c.vx=c.vy=0;}}
    else c.st=0;
  }
}

/* ====== RESIZE ====== */
function resize(){
  const w=stage.clientWidth,h=stage.clientHeight;if(!w||!h)return;
  if(w===W&&h===H)return;
  if(W&&H){coins.forEach(c=>{if(c.x!=null){c.x*=w/W;c.y*=h/H;c.tx*=w/W;c.ty*=h/H;}});}
  W=w;H=h;cv.width=Math.round(W*DPR);cv.height=Math.round(H*DPR);
  view.k=1;view.x=view.y=0;clampView();
  coins.forEach(c=>c.sp=null);
  relayout();
}
let rt;new ResizeObserver(()=>{clearTimeout(rt);rt=setTimeout(resize,120);}).observe(stage);

(function(){

/* ====== START: ambil cache (data + logo) dulu -> langsung tampil penuh, lalu update dari jaringan ====== */
(async function boot(){
  resize();
  await DB.open();
  try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist();}catch(e){}
  let cached=await DB.get('data');
  if(!cached||!cached.d||!cached.d.length){cached=null;try{cached=JSON.parse(localStorage.getItem('cg_cache1')||'null');}catch(e){}}
  if(cached&&cached.d&&cached.d.length){ingest(cached.d,true);lastT=cached.t||0;demo=false;relayout();refreshUI();}
  await Promise.race([loadLogosFromDB(),sleep(2500)]);
  requestAnimationFrame(frame);
  queueLogos();
  load();
  setInterval(()=>{if(!document.hidden)load();},REFRESH_MS);
  document.addEventListener('visibilitychange',()=>{if(!document.hidden&&Date.now()-lastT>REFRESH_MS)load();});
})();
})();
