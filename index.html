<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Crypto World">
<link rel="preconnect" href="https://api.coingecko.com" crossorigin>
<link rel="preconnect" href="https://assets.coingecko.com" crossorigin>
<title>Crypto World</title>
<style>
:root{--bg:#000;--panel:#0b1317;--line:#1d2b32;--txt:#f2f6f7;--mut:#8b9ba3;--g:#22e07a;--r:#ff4d4d;--p:#a78bfa}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg);color:var(--txt);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden;overscroll-behavior:none}
#app{height:100dvh;display:flex;flex-direction:column;gap:6px;padding:max(8px,env(safe-area-inset-top)) 4px max(6px,env(safe-area-inset-bottom))}
header{padding:0 6px;display:flex;align-items:center;gap:8px}
.logo{width:30px;height:30px;flex:none;border-radius:50%}
.ttl{flex:1;min-width:0}
h1{font-size:16px;line-height:1.1;font-weight:800;letter-spacing:-.3px}
h1 b{color:var(--g)}
.sub{display:none!important;font-size:9.5px;color:var(--mut);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stats{padding:0 4px;display:grid;grid-template-columns:1fr 1.15fr 1fr;gap:5px}
.card{border:1px solid var(--line);border-radius:10px;background:var(--panel);padding:5px 7px;display:flex;align-items:center;gap:6px;min-width:0}
.card svg{width:18px;height:18px;flex:none}
.card .v{font-size:12.5px;font-weight:800;line-height:1.1;white-space:nowrap}
.card .l{font-size:9px;color:var(--mut);margin-top:1px;white-space:nowrap}
.up{color:var(--g)}.dn{color:var(--r)}.nu{color:var(--p)}
.bar{padding:0 6px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.seg{flex:1;display:flex;border:1px solid var(--line);border-radius:9px;background:var(--panel);overflow:hidden}
.seg button{touch-action:manipulation;flex:1;background:none;border:0;color:var(--mut);font-weight:700;font-size:10.5px;padding:5px 2px;white-space:nowrap}
#rg{flex:none;height:28px;display:flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:9px;background:var(--panel);color:var(--txt);font-size:10.5px;font-weight:700;padding:0 8px;white-space:nowrap;touch-action:manipulation;cursor:pointer}
#rg svg{width:9px;height:6px;flex:none;transition:transform .15s}
#rg.open svg{transform:rotate(180deg)}
#rgm{position:fixed;z-index:60;display:none;min-width:118px;max-height:min(62vh,390px);overflow-y:auto;overscroll-behavior:contain;padding:5px;border-radius:16px;background:rgba(0,0,0,.72);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,.12);box-shadow:0 10px 30px rgba(0,0,0,.6)}
#rgm button{display:block;width:100%;text-align:left;background:none;border:0;color:var(--mut);font-size:12px;font-weight:700;padding:8px 10px;border-radius:10px;touch-action:manipulation}
#rgm button.on{color:var(--g);background:rgba(34,224,122,.12)}
#rgm button:active{background:rgba(255,255,255,.08)}
.seg button.on{background:#16262d;color:var(--txt);box-shadow:inset 0 -2px 0 var(--g)}
#stage{position:relative;flex:1;min-height:0;border-radius:10px;overflow:hidden;background:#000;border:1px solid #0e1a20}
#tt{position:absolute;right:8px;bottom:8px;z-index:6;pointer-events:auto;flex:none;width:24px;height:22px;border-radius:7px;background:rgba(11,19,23,.6);border:1px solid var(--line);color:var(--txt);font-size:11px;line-height:1;touch-action:manipulation}
#top{position:absolute;right:8px;bottom:36px;z-index:5;width:calc(64% - 12px);min-width:230px;max-height:calc(100% - 90px);display:none;flex-direction:column;border:1px solid rgba(160,165,170,.28);border-radius:12px;background:rgba(0,0,0,.16);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);overflow:hidden}
#top.open{display:flex}
#top .th{flex:none;display:flex;align-items:center;gap:10px;height:30px;padding:0 14px;border-bottom:1px solid rgba(160,165,170,.2);font-size:9px;font-weight:800;color:rgba(201,210,214,.6);letter-spacing:.3px}
#top .th .no{width:24px;flex:none;text-align:right}
#top .th .sy{flex:1;margin-left:24px}
#top .th .ch{flex:none}
#tl{flex:0 1 270px;min-height:0;overflow-y:auto;overscroll-behavior:contain;touch-action:pan-y;scrollbar-width:none;-webkit-overflow-scrolling:touch}
#tl::-webkit-scrollbar{display:none}
#top .it{display:flex;align-items:center;gap:10px;height:27px;padding:0 14px;font-size:9.5px;font-weight:700;color:rgba(213,221,224,.58);cursor:pointer;border-bottom:1px solid rgba(160,165,170,.1)}
#top .it:active{background:rgba(255,255,255,.08)}
#top .no{width:24px;flex:none;color:rgba(125,140,147,.6);font-size:8.5px;text-align:right}
#top img{width:14px;height:14px;opacity:.8;border-radius:50%;flex:none;object-fit:cover}
#top .sy{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#top .sy small{color:rgba(139,155,163,.55);font-weight:600;margin-left:6px;font-size:8px}
#top .ch{flex:none;font-size:9px;font-weight:800;text-align:right}
#top .ch.up{color:rgba(26,255,122,.5)}#top .ch.dn{color:rgba(255,48,48,.5)}#top .ch.nu{color:rgba(167,139,250,.5)}
#cv{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block;cursor:grab}
#ctl{display:none!important;position:absolute;right:8px;top:8px;display:flex;flex-direction:column;gap:6px;z-index:5}
#ctl button{width:36px;height:36px;background:rgba(11,19,23,.85);border:1px solid var(--line);color:var(--txt);border-radius:10px;font-size:19px;font-weight:700;line-height:1;touch-action:manipulation}
#zl{position:absolute;left:8px;bottom:8px;font-size:11px;font-weight:700;color:var(--mut);background:rgba(11,19,23,.7);border:1px solid var(--line);border-radius:8px;padding:3px 7px;pointer-events:none}
#mm{display:none!important;position:absolute;right:8px;bottom:8px;width:88px;height:88px;border:1px solid var(--line);border-radius:12px;background:rgba(3,6,14,.72);touch-action:none;z-index:5}
#boot{position:absolute;inset:0;z-index:30;display:grid;place-items:center;background:#000;transition:opacity .3s}
#boot .bw{display:flex;flex-direction:column;align-items:center;gap:12px;padding:20px;text-align:center}
#boot svg{width:70px;height:70px;animation:spin 6s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
#bootT{font-weight:800;font-size:15px}
.bbar{width:200px;height:6px;border-radius:4px;background:#16262d;overflow:hidden}
.bbar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#22e07a,#a78bfa);transition:width .3s}
#bootN{font-size:11px;color:var(--mut);min-height:14px}
#bd{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;z-index:20}
#info{position:fixed;inset:0;margin:auto;width:min(92vw,380px);height:fit-content;z-index:21;display:none;background:rgba(11,19,23,.94);border:1px solid var(--line);border-radius:14px;padding:14px 14px 16px;box-shadow:0 10px 40px rgba(0,0,0,.7);touch-action:none;transition:transform .22s ease,opacity .22s ease}
.ctab{display:flex;align-items:center;gap:4px;margin-top:10px}
.ctab button{background:none;border:1px solid var(--line);color:var(--mut);font-size:10px;font-weight:700;border-radius:7px;padding:3px 8px;touch-action:manipulation}
.ctab button.on{background:#16262d;color:var(--txt)}
.ctab span{margin-left:auto;font-size:11px;font-weight:800}
.cbox{position:relative;height:96px;margin-top:6px}
.cbox canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
#chs{position:absolute;inset:0;display:grid;place-items:center;font-size:11px;color:var(--mut)}
.cmm{display:flex;justify-content:space-between;font-size:10px;color:var(--mut);margin-top:3px}
#info .wl{display:flex;gap:8px;margin-top:10px}
#info .wl a{flex:1;margin:0;display:flex;align-items:center;justify-content:center;gap:6px;padding:9px 6px;border-radius:10px;background:#101c22;border:1px solid var(--line);color:var(--txt);font-size:12px}
#info .wl svg{width:16px;height:16px;flex:none}
#info .wl i{width:9px;height:9px;border-radius:50%;flex:none}
#info.drag{transition:none}
#grab{width:38px;height:4px;border-radius:3px;background:#2c3d46;margin:-4px auto 8px}
#info .t{display:flex;align-items:center;gap:10px}
#info .more{display:block;margin-top:10px;border-top:1px solid var(--line);padding-top:9px;font-size:12px;color:var(--mut)}
#info .more p{display:flex;justify-content:space-between;padding:4px 0}
#info .more p b{color:var(--txt)}
#info img,#info .ph{width:36px;height:36px;border-radius:50%;flex:none;background:#fff}
#info .ph{display:grid;place-items:center;color:#000;font-weight:800;font-size:12px}
#info .n{font-weight:800;font-size:15px;min-width:0}
#info .n small{color:var(--mut);font-weight:600;margin-left:5px;font-size:11px}
#info .pr{margin-left:auto;text-align:right;font-weight:800;font-size:15px}
#info .pr small{display:block;font-size:11px;font-weight:700}
#info .row{display:flex;gap:6px;margin-top:9px;font-size:11.5px}
#info .row div{flex:1;background:#101c22;border-radius:9px;padding:5px 7px;color:var(--mut)}
#info .row b{display:block;font-size:13px;margin-top:1px}
#info a{display:block;margin-top:8px;color:var(--g);font-size:12px;text-decoration:none;font-weight:700}
#x{position:absolute;right:8px;top:6px;background:none;border:0;color:var(--mut);font-size:18px;padding:2px 6px}
.legend{display:flex;justify-content:center}
.legend div{display:flex;border:1px solid var(--line);border-radius:14px;background:var(--panel);padding:4px 2px}
.legend span{display:flex;align-items:center;gap:5px;font-size:10px;padding:3px 10px;border-left:1px solid var(--line);cursor:pointer;touch-action:manipulation;user-select:none;-webkit-user-select:none;transition:opacity .15s,background .15s}
.legend span.on{background:#16262d}
.legend span.on em{color:var(--txt)}
.legend.f span:not(.on){opacity:.4}
.legend span:first-child{border:0}
.legend i{width:9px;height:9px;border-radius:50%}
.legend em{font-style:normal;color:var(--mut);font-size:9px}
@media (max-height:700px){.legend{display:none}}

#sb{position:absolute;right:8px;top:8px;z-index:5;width:34px;height:34px;display:grid;place-items:center;border-radius:10px;background:rgba(11,19,23,.85);border:1px solid var(--line);color:var(--txt);touch-action:manipulation;cursor:pointer}
#sb svg{width:18px;height:18px}
#sw{position:fixed;inset:0;z-index:45;display:none;flex-direction:column;background:rgba(0,0,0,.07);-webkit-backdrop-filter:blur(2px);backdrop-filter:blur(2px);padding-top:env(safe-area-inset-top)}
#sws{flex:none;margin:6px 10px;background:rgba(11,19,23,.15)}
#mood{position:absolute;left:6px;top:8px;width:calc(58% - 12px);z-index:3;pointer-events:none;display:flex;align-items:flex-end;gap:6px}
#mood .ft{flex:none;font-size:9px;font-weight:800;line-height:1;color:rgba(235,240,242,.6);text-shadow:0 1px 3px #000;white-space:nowrap;margin-bottom:-2.5px}
#mood .mc{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
#mood .fg{text-align:center;font-size:9.5px;font-weight:800;line-height:1.1;color:rgba(235,240,242,.72);text-shadow:0 1px 3px #000;white-space:nowrap}
#mood .mb{display:flex;width:100%;height:4px;border-radius:3px;overflow:hidden;background:rgba(255,255,255,.04)}
#mood i{display:block;height:100%;transition:width .6s ease}
#mood #mg{background:rgba(34,224,122,.32)}
#mood #mr{background:rgba(255,77,77,.32)}
#swh{display:flex;align-items:center;gap:8px;padding:8px 10px;border-bottom:1px solid rgba(255,255,255,.08)}
#swX{width:32px;height:32px;flex:none;border-radius:9px;border:1px solid var(--line);background:var(--panel);color:var(--txt);font-size:20px;line-height:1;touch-action:manipulation}
#swQ{flex:1;min-width:0;height:32px;border-radius:9px;border:1px solid var(--line);background:rgba(11,19,23,.15);color:var(--txt);font-size:16px;padding:0 10px;outline:none;-webkit-appearance:none;appearance:none}
#swQ:focus{border-color:#2c3d46}
#swN{flex:none;font-size:10px;color:var(--mut);white-space:nowrap}
#swl{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding-bottom:env(safe-area-inset-bottom);-webkit-overflow-scrolling:touch}
#swl .sr{display:flex;align-items:center;gap:9px;padding:9px 12px;border-bottom:1px solid rgba(255,255,255,.06);cursor:pointer}
#swl .sr:active{background:rgba(255,255,255,.06)}
#swl .no{width:30px;flex:none;text-align:right;font-size:10px;color:#66757c;font-weight:700}
#swl img,#swl .ph{width:26px;height:26px;border-radius:50%;flex:none;background:#16262d;object-fit:cover}
#swl .nm{flex:1;min-width:0;display:flex;flex-direction:column}
#swl .sr{text-shadow:0 1px 3px #000}
#swl .nm b{font-size:13px;font-weight:800}
#swl .nm small{font-size:10px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#swl .pc{flex:none;text-align:right;display:flex;flex-direction:column}
#swl .pc b{font-size:12.5px;font-weight:800}
#swl .pc small{font-size:11px;font-weight:700}
#swl .em{padding:40px 16px;text-align:center;color:var(--mut);font-size:12px}

#info .wl button{flex:none;width:46px;display:grid;place-items:center;border-radius:10px;background:#101c22;border:1px solid var(--line);touch-action:manipulation;cursor:pointer}
#info .wl #cdl svg{width:20px;height:20px}
#cw{position:fixed;inset:0;z-index:40;display:none;flex-direction:column;background:#000;padding-top:env(safe-area-inset-top)}
#cwh{display:flex;align-items:center;gap:8px;padding:8px 10px;border-bottom:1px solid var(--line)}
#cwX{width:32px;height:32px;flex:none;border-radius:9px;border:1px solid var(--line);background:var(--panel);color:var(--txt);font-size:20px;line-height:1;touch-action:manipulation}
#cwt{flex:1;min-width:0;display:flex;flex-direction:column}
#cwT{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#cwS{font-size:10px;color:var(--mut);margin-top:1px}
#cwO{flex:none;font-size:11px;font-weight:700;color:var(--g);text-decoration:none;border:1px solid var(--line);border-radius:9px;padding:7px 10px;background:var(--panel)}
#cwb{position:relative;flex:1;min-height:0;padding-bottom:env(safe-area-inset-bottom)}
#cwb iframe{position:absolute;inset:0;width:100%;height:calc(100% - env(safe-area-inset-bottom));border:0;background:transparent}
.cwm{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;color:var(--mut);font-size:12px;text-align:center;padding:24px}
.cwm button{background:var(--panel);border:1px solid var(--line);color:var(--txt);border-radius:9px;padding:8px 14px;font-weight:700;font-size:12px}
</style>
</head>
<body>
<div id="app">
  <header>
    <svg class="logo" viewBox="0 0 44 44"><circle cx="22" cy="22" r="21" fill="#000" stroke="#1d2b32" stroke-width="1"/><circle cx="19" cy="20" r="9" fill="#22e07a"/><circle cx="31" cy="14" r="5" fill="#ff4d4d"/><circle cx="30" cy="30" r="7" fill="#a78bfa"/><circle cx="13" cy="33" r="4" fill="#ff4d4d"/></svg>
    <div class="ttl"><h1>Crypto <b>World</b></h1><div class="sub" id="sub">Memuat data CoinGecko…</div></div>
  </header>

  <div class="stats">
    <div class="card"><svg viewBox="0 0 24 24" fill="none" stroke="#fbbf24" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><path d="M9 8h5a2 2 0 010 4H9m0 0h5.5a2 2 0 010 4H9M9 6v12M12 5v2M12 17v2"/></svg><div><div class="v" id="sCoins">–</div><div class="l">Total Koin</div></div></div>
    <div class="card"><svg viewBox="0 0 24 24" fill="#22e07a"><rect x="3" y="14" width="4" height="7" rx="1"/><rect x="10" y="10" width="4" height="11" rx="1"/><rect x="17" y="5" width="4" height="16" rx="1"/></svg><div><div class="v" id="sCap">–</div><div class="l">Market Cap</div></div></div>
    <div class="card"><svg id="sArr" viewBox="0 0 24 24" fill="#22e07a"><path d="M12 4l9 15H3z"/></svg><div><div class="v up" id="sChg">–</div><div class="l">Rata-rata 24 Jam</div></div></div>
  </div>

  <div class="bar"><div class="seg" id="seg"><button data-s="pop" class="on">Populer</button><button data-s="gain">Gainer</button><button data-s="loss">Loser</button><button data-s="vol">Volatil</button></div><button id="rg" type="button" aria-haspopup="listbox" aria-label="Urutkan berdasarkan peringkat"><span id="rgT">Semua</span><svg viewBox="0 0 10 6"><path d="M1 1l4 4 4-4" fill="none" stroke="#8b9ba3" stroke-width="1.6" stroke-linecap="round"/></svg></button></div>

  <div id="stage">
    <canvas id="cv"></canvas>
    <div id="ctl"><button id="zi" aria-label="Zoom in">+</button><button id="zo" aria-label="Zoom out">−</button><button id="reset" aria-label="Pusat galaksi">⟲</button></div>
    <button id="tt" aria-label="Sembunyikan / tampilkan daftar">▴</button>
    <div id="top"><div class="th"><span class="no">No</span><span class="sy">Nama</span><span class="ch">Gain</span></div><div id="tl"></div></div>
    <button id="sb" aria-label="Cari koin"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg></button>
    <div id="mood"><span class="ft">Fear &amp; Greed Index</span><div class="mc"><div class="fg"><b id="fgv">–</b></div><div class="mb"><i id="mg" style="width:50%"></i><i id="mr" style="width:50%"></i></div></div></div>
    <div id="zl">×1.0</div>
    <canvas id="mm" width="176" height="176"></canvas>
    <div id="boot"><div class="bw">
      <svg viewBox="0 0 44 44"><circle cx="22" cy="22" r="21" fill="#000" stroke="#1d2b32" stroke-width="1"/><circle cx="19" cy="20" r="9" fill="#22e07a"/><circle cx="31" cy="14" r="5" fill="#ff4d4d"/><circle cx="30" cy="30" r="7" fill="#a78bfa"/><circle cx="13" cy="33" r="4" fill="#ff4d4d"/></svg>
      <div id="bootT">Menyiapkan galaksi…</div>
      <div class="bbar"><i id="bootB"></i></div>
      <div id="bootN"></div>
    </div></div>
    <div id="bd"></div>
    <div id="info"><div id="grab"></div><button id="x">×</button><div id="infoIn"></div></div>
  </div>

  <div class="legend" id="lg"><div>
    <span data-f="g"><i style="background:var(--g)"></i>Naik <em id="nG">0</em></span>
    <span data-f="r"><i style="background:var(--r)"></i>Turun <em id="nR">0</em></span>
    <span data-f="p"><i style="background:var(--p)"></i>Netral <em id="nP">0</em></span>
  </div></div>
</div>

<div id="rgm" role="listbox"></div>
<div id="sw"><div id="swh"><button id="swX" aria-label="Tutup">&#8249;</button><input id="swQ" type="search" placeholder="Cari koin…" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="search"></div><div class="seg" id="sws"><button data-s="pop" class="on">Populer</button><button data-s="gain">Gainer</button><button data-s="loss">Loser</button><button data-s="vol">Volatil</button></div><div id="swl"></div></div>
<div id="cw"><div id="cwh"><button id="cwX" aria-label="Tutup">&#8249;</button><div id="cwt"><b id="cwT"></b><small id="cwS"></small></div><a id="cwO" target="_blank" rel="noopener" style="display:none">Buka &#8599;</a></div><div id="cwb"></div></div>
<script>
(function(){
'use strict';
/* ====== PENGATURAN ====== */
const API='https://api.coingecko.com/api/v3/coins/markets?vs_currency=usd&order=market_cap_desc&per_page=250&sparkline=false&price_change_percentage=1h,24h,7d&page=';
const PER_PAGE=250;
const PAGES=40;              /* 40 x 250 = 10.000 koin */
const NEUTRAL=0.1;           /* % */
const REFRESH_MS=120000;     /* interval pembaruan */
const PER_REFRESH=6;         /* setelah muat penuh: halaman 1 + 5 halaman bergilir tiap pembaruan */

/* ====== LOGO KOIN (cache IndexedDB; diunduh sesuai kebutuhan, yang terlihat duluan) ====== */
const imgs={},lp={};let lq=[],lact=0;
function setLogo(id,im){imgs[id]=im;delete tex[id];}
const scr={};
function fetchLogo(c,keep){
  return new Promise(res=>{
    const big=(c.rank||9999)<=100;
    const url=big?c.image:c.image.replace('/large/','/small/');
    const im=new Image();im.crossOrigin='anonymous';
    im.onload=()=>{
      try{
        const S=big?112:64;
        const cn=keep?document.createElement('canvas'):(scr[S]||(scr[S]=document.createElement('canvas')));
        cn.width=cn.height=S;
        cn.getContext('2d').drawImage(im,0,0,S,S);
        if(cn.toBlob)cn.toBlob(b=>{if(b)DB.set('l:'+c.id,b);},'image/webp',.9);   /* async: tidak memblokir layar */
        else DB.set('l:'+c.id,cn.toDataURL('image/png'));
        if(keep)setLogo(c.id,cn);else if(c.mini===undefined)mkMini(c,cn);
        res();return;
      }catch(e){}
      if(keep)setLogo(c.id,im);res();
    };
    im.onerror=()=>{if(!keep){c.bad=true;res();return;}const i3=new Image();i3.onload=()=>{setLogo(c.id,i3);res();};i3.onerror=()=>{c.bad=true;res();};i3.src=url;};
    im.src=url;
  });
}
function enqLogo(c,res){
  lq.push({c:c,res:res});
  if(lq.length>1500){lq.splice(0,lq.length-1500).forEach(x=>{delete lp[x.c.id];x.res();});}
  pumpLogos();
}
function pumpLogos(){
  while(lact<20&&lq.length){
    const q=lq.pop();lact++;   /* yang terbaru diminta duluan (yang sedang terlihat) */
    fetchLogo(q.c,true).then(()=>{lact--;q.res();pumpLogos();warmPump();});
  }
}
function ensureLogo(c){
  if(!c.image||imgs[c.id])return Promise.resolve();
  if(lp[c.id])return lp[c.id];
  return lp[c.id]=new Promise(res=>{
    DB.get('l:'+c.id).then(u=>{
      if(u){const im=new Image();im.onload=()=>{setLogo(c.id,im);res();};im.onerror=()=>enqLogo(c,res);im.src=u;}
      else enqLogo(c,res);
    });
  });
}
function decodeLogo(u){
  return new Promise((res,rej)=>{
    if(typeof u!=='string'&&window.createImageBitmap){createImageBitmap(u).then(res,rej);return;}
    const im=new Image(),url=typeof u==='string'?u:URL.createObjectURL(u);
    im.onload=()=>{if(typeof u!=='string')URL.revokeObjectURL(url);res(im);};im.onerror=rej;im.src=url;
  });
}
/* muat banyak logo sekaligus: 1 transaksi IndexedDB, sisanya (yang belum ada di cache) diunduh paralel */
async function loadLogos(arr,cb){
  const need=arr.filter(c=>c.image&&!imgs[c.id]&&!lp[c.id]&&!c.pend);
  need.forEach(c=>{c.pend=true;});
  const got=await DB.getMany(need.map(c=>'l:'+c.id));
  let done=0;const tot=need.length;
  await Promise.all(need.map(c=>{
    const u=got['l:'+c.id];
    return lp[c.id]=new Promise(res=>{
      const fin=()=>{c.pend=false;done++;if(cb)cb(done,tot);res();};
      if(u){decodeLogo(u).then(im=>{setLogo(c.id,im);fin();},()=>enqLogo(c,fin));}
      else enqLogo(c,fin);
    });
  }));
}
/* koin yang terlihat di tampilan awal (besar dulu) */
function visibleCoins(max){
  const vx0=-view.x/view.k,vy0=-view.y/view.k,vx1=vx0+W/view.k,vy1=vy0+H/view.k,a=[];
  for(let i=0;i<list.length&&a.length<max;i++){

    if(r*view.k<SPR_MIN)continue;
    if(c.tx+r<vx0||c.tx-r>vx1||c.ty+r<vy0||c.ty-r>vy1)continue;
    a.push(c);
  }

}

/* logo mini untuk SEMUA koin, otomatis tanpa perlu zoom: baca cache dalam batch, tanpa menyimpan gambar penuh di memori */
async function loadMinis(arr){
  const need=arr.filter(c=>c.image&&!c.bad&&c.mini===undefined&&!imgs[c.id]&&!c.pend&&!c.mpend&&!wseen.has(c.id));
  need.forEach(c=>{c.mpend=true;});
  const got=await DB.getMany(need.map(c=>'l:'+c.id));
  const miss=[];
  await Promise.all(need.map(c=>new Promise(res=>{
    const u=got['l:'+c.id],fin=()=>{c.mpend=false;res();};
    if(!u){miss.push(c);fin();return;}
    decodeLogo(u).then(im=>{if(c.mini===undefined)mkMini(c,im);if(im.close)im.close();fin();},fin);
  })));
  if(miss.length)warmPush(miss,true);
}

let haveP=null;const wseen=new Set(),wq=[];let wact=0;
function warmPush(arr,front){
  if(!DB.db)return;
  if(!haveP)haveP=DB.keys();
  haveP.then(have=>{
    arr.forEach(c=>{if(c&&c.image&&!c.bad&&!imgs[c.id]&&!wseen.has(c.id)&&!have.has('l:'+c.id)){wseen.add(c.id);if(front)wq.unshift(c);else wq.push(c);}});
    warmPump();
  });
}
function warmPump(){
  const lim=ready?4:10;
  while(wact<lim&&wq.length&&!(ready&&performance.now()-viewT<400)){
    const c=wq.shift();if(imgs[c.id])continue;
    wact++;fetchLogo(c,false).then(()=>{wact--;warmPump();});
  }
}

/* ====== LAYOUT GALAKSI: deterministik, instan (tanpa iterasi), koin besar di pusat, spiral keluar ====== */
/* penempatan koin: dihitung di Web Worker (tidak memblokir layar), hasilnya di-cache per mode */
function placeLayout(d){
  var n=d.n,w=d.w,h=d.h,WS=d.WS,KD=d.KD,i,sw=0;
  for(i=0;i<n;i++)sw+=w[i]*w[i];
  var s=WS*.46/Math.sqrt(KD*sw),Rw=WS*.46,C=WS/2,tr=new Float32Array(n),tx=new Float32Array(n),ty=new Float32Array(n),rmax=0;
  for(i=0;i<n;i++){tr[i]=w[i]*s;if(tr[i]>rmax)rmax=tr[i];}
  var cell=Math.max(16,rmax*2+4),cols=Math.ceil(WS/cell)+1;
  var head=new Int32Array(cols*cols).fill(-1),next=new Int32Array(n);
  function rnd(seed){var t=(seed+0x6D2B79F5)|0;t=Math.imul(t^(t>>>15),t|1);t^=t+Math.imul(t^(t>>>7),t|61);return((t^(t>>>14))>>>0)/4294967296;}
  function cl(v,a,b){return Math.max(a,Math.min(b,v));}
  for(i=0;i<n;i++){
    var r=tr[i],Rc=Rw*(.35+.65*Math.min(1,i/1500)),x=C,y=C,ok=false;
    for(var at=0;at<260&&!ok;at++){
      if(at>0&&at%50===0)Rc=Math.min(Rw,Rc*1.25);
      var sd=(h[i]^Math.imul(at+1,2654435761))|0;
      var ang=rnd(sd)*6.2832,rad=Rc*Math.sqrt(rnd(sd+1013));
      x=cl(C+rad*Math.cos(ang),r+1,WS-r-1);y=cl(C+rad*Math.sin(ang),r+1,WS-r-1);
      var gx=Math.floor(x/cell),gy=Math.floor(y/cell);ok=true;
      for(var oy=-1;oy<=1&&ok;oy++)for(var ox=-1;ox<=1&&ok;ox++){
        var X=gx+ox,Y=gy+oy;if(X<0||Y<0||X>=cols||Y>=cols)continue;
        for(var j=head[X+Y*cols];j>=0;j=next[j]){
          var m=r+tr[j]+3,dx=tx[j]-x,dy=ty[j]-y;
          if(dx*dx+dy*dy<m*m){ok=false;break;}
        }
      }
    }
    tx[i]=x;ty[i]=y;
    var g=Math.floor(x/cell)+Math.floor(y/cell)*cols;next[i]=head[g];head[g]=i;
  }
  return{tr:tr,tx:tx,ty:ty};
}
let lw=null,layId=0,layCbs=[],layJob=null;const LC={};
function startWorker(){
  if(lw||typeof Worker==='undefined')return;
  try{
    const src='self.onmessage=function(e){var r=('+placeLayout.toString()+')(e.data);r.id=e.data.id;self.postMessage(r,[r.tr.buffer,r.tx.buffer,r.ty.buffer]);};';
    lw=new Worker(URL.createObjectURL(new Blob([src],{type:'text/javascript'})));
    lw.onmessage=onLay;lw.onerror=()=>{lw=null;};
  }catch(e){lw=null;}
}
function computeW(L){
  if(sortBy==='pop'){
    let mn=1e30,mx=-1e30;L.forEach(c=>{c.lg=Math.log(Math.max(1,c.score));if(c.lg<mn)mn=c.lg;if(c.lg>mx)mx=c.lg;});
    L.forEach(c=>{const n=(c.lg-mn)/Math.max(.001,mx-mn);c.w=.35+1.5*Math.pow(n,2.1);});
  }else if(sortBy==='vol'){
    const vals=L.map(c=>Math.abs(chg(c))).sort((a,b)=>a-b);
    const cap=Math.max(.5,vals[Math.floor(vals.length*.95)]||1);

function getMap(T){
  if(maps[T])return maps[T];
  const R=(T-4)/2,m=T/2,n=T*T,U=new Float32Array(n),V=new Float32Array(n),sh=new Uint8Array(n),sp=new Uint8Array(n),al=new Uint8Array(n);

    if(r2>=1.05)continue;

function drawSphere(g,T,tx,TWd,dim){
  const mp=getMap(T),out=g.createImageData(T,T),o=out.data,n=T*T,w1=TWd-1;

    const x0=Math.min(w1-1,fx|0),y0=Math.min(w1-1,fy|0),ax=fx-x0,ay=fy-y0;

let prevT=0,glG=null;
const DOTC='rgba(150,168,205,.6)';function frame(t){
  requestAnimationFrame(frame);

  const dt=clamp((t-(prevT||t))/16.67,.5,3);prevT=t;physics(dt);motion(dt);
  ctx.setTransform(DPR,0,0,DPR,0,0);ctx.clearRect(0,0,W,H);

  ctx.imageSmoothingEnabled=true;ctx.imageSmoothingQuality=moving?'low':'high';
  drawStars(t);
  ctx.translate(view.x,view.y);ctx.scale(view.k,view.k);

  glG.addColorStop(0,'rgba(120,90,230,.30)');glG.addColorStop(.35,'rgba(70,50,170,.16)');glG.addColorStop(.7,'rgba(30,60,140,.07)');glG.addColorStop(1,'rgba(10,20,60,0)');}
  /* latar hitam polos: tanpa cahaya galaksi */
  /* zoom-out jauh: koin kecil digambar sebagai 1 lapisan cache (1 drawImage), hanya koin besar yang digambar satu per satu */
  let lim=list.length,extra=null;
  if(view.k<=LK&&nBig<list.length&&!trans){
    if(layerDirty&&(!layerOK||needBuild||(!moving&&tb-layerT>1500)))buildLayer();
    if(layerOK){ctx.drawImage(layer,0,0,LSZ,LSZ,0,0,WS,WS);lim=nBig;extra=act.filter(c=>c.li>=nBig&&(c.free||c===held));}
  }
  const total=lim+(extra?extra.length:0);
  const P={n:new Path2D()},hl=new Path2D(),miss=[];
  for(let ii=0;ii<total;ii++){
    const c=ii<lim?list[ii]:extra[ii-lim];
    if(c.r<.25)continue;
    if(flt&&cls(c)!==flt)continue;
    const pad=c.r*1.9;
    if(c.x+pad<vx0||c.x-pad>vx1||c.y+pad<vy0||c.y-pad>vy1){if(c.sp)c.sp=null;continue;}
    const sr=c.r*view.k,k=cls(c);

        if(c.mini)ctx.drawImage(AT[c.ma],c.mx,c.my,24,24,c.x+dx-c.r,c.y+dy-c.r,2*c.r,2*c.r);   /* sementara pakai logo mini sampai versi besar siap */
        continue;
      }
      if((!moving||!c.sp)&&Math.abs(c.tr-c.r)<c.tr*.12+.3&&performance.now()-tb<(moving?3:6)){
        const need=needS(c);
        if(!c.sp||c.spK!==k||c.spImg!==!!imgs[c.id]||c.spMode!==modeOf(c)||(c.spMode&&c.spTx!==chg(c))||c.spS<need*.75||c.spS>need*2.5)mkSprite(c);

  let sd=((c.h||1)^Math.imul(key==='1h'?11:key==='7d'?77:24,2654435761))>>>0;
  const rnd=()=>{sd=(sd+0x6D2B79F5)|0;let t=Math.imul(sd^(sd>>>15),1|sd);t^=t+Math.imul(t^(t>>>7),61|t);return((t^(t>>>14))>>>0)/4294967296;};
  const gs=()=>rnd()+rnd()+rnd()-1.5;
  const w=[0];for(let i=1;i<n;i++)w.push(w[i-1]+gs());
  const bridge=a=>{const d=a[n-1]-a[0];return a.map((v,i)=>v-a[0]-d*i/(n-1));};
  let z=bridge(w);
  for(let p=0;p<2;p++){const q=z.slice();for(let i=1;i<n-1;i++)q[i]=(z[i-1]+z[i]*2+z[i+1])/4;z=bridge(q);}
  let m=0;z.forEach(v=>{if(Math.abs(v)>m)m=Math.abs(v);});if(m<1e-9)m=1;z=z.map(v=>v/m);
  let amp=price*(key==='1h'?Math.max(Math.abs(pc)*.8,.15):key==='7d'?Math.max(Math.abs(pc)*.6,2):Math.max(Math.abs(pc)*.5,.6))/100;
  if(key==='24h'&&c.hi>0&&c.lo>0&&c.hi>c.lo){   /* pas dengan High/Low 24 jam asli */
    let up=1e300,dn=1e300;
    for(let i=0;i<n;i++){
      const L=start+(price-start)*i/(n-1);
      if(z[i]>.001)up=Math.min(up,(c.hi-L)/z[i]);
      if(z[i]<-.001)dn=Math.min(dn,(L-c.lo)/-z[i]);
    }
    const a=Math.min(up,dn);if(isFinite(a)&&a>0&&a<1e299)amp=a;
  }
  const out=[];
  for(let i=0;i<n;i++){const L=start+(price-start)*i/(n-1);out.push([i,Math.max(price*1e-6,L+z[i]*amp)]);}
  return out;
}
function drawChart(cvs,pts,prog,col,now){
  const g=cvs.getContext('2d'),w=cvs.width,h=cvs.height,n=pts.length,pad=6*DPR;
  g.clearRect(0,0,w,h);
  let mn=1e300,mx=-1e300;
  for(let i=0;i<n;i++){const v=pts[i][1];if(v<mn)mn=v;if(v>mx)mx=v;}
  if(mx===mn){mx+=1;mn-=1;}
  const X=i=>pad+(w-2*pad)*i/(n-1),Y=v=>pad+(h-2*pad)*(1-(v-mn)/(mx-mn));
  g.save();g.setLineDash([3*DPR,4*DPR]);g.strokeStyle='rgba(255,255,255,.14)';g.lineWidth=DPR;
  g.beginPath();g.moveTo(0,Y(pts[0][1]));g.lineTo(w,Y(pts[0][1]));g.stroke();g.restore();
  const up=Math.min(n-1,prog*(n-1)),last=Math.floor(up);
  const line=new Path2D();line.moveTo(X(0),Y(pts[0][1]));
  for(let i=1;i<=last;i++)line.lineTo(X(i),Y(pts[i][1]));
  let ex=X(last),ey=Y(pts[last][1]);
  if(last<n-1){const f=up-last;ex+=(X(last+1)-ex)*f;ey+=(Y(pts[last+1][1])-ey)*f;line.lineTo(ex,ey);}
  const area=new Path2D(line);area.lineTo(ex,h);area.lineTo(X(0),h);area.closePath();
  const gr=g.createLinearGradient(0,0,0,h);gr.addColorStop(0,col+'55');gr.addColorStop(1,col+'00');
  g.fillStyle=gr;g.fill(area);
  g.lineJoin='round';g.lineCap='round';g.lineWidth=1.8*DPR;g.strokeStyle=col;g.shadowColor=col;g.shadowBlur=8*DPR;g.stroke(line);g.shadowBlur=0;
  g.fillStyle=col;g.beginPath();g.arc(ex,ey,3*DPR,0,7);g.fill();
  if(prog>=1){const ph=(now%1400)/1400;g.globalAlpha=(1-ph)*.55;g.strokeStyle=col;g.lineWidth=1.5*DPR;g.beginPath();g.arc(ex,ey,(3+8*ph)*DPR,0,7);g.stroke();g.globalAlpha=1;}
}

function pickTV(c,tk){
  let best=null,bs=1e9;
  tk.forEach(t=>{
    if(!t||t.is_stale||t.is_anomaly||!t.market)return;
    if(t.coin_id&&t.coin_id!==c.id)return;
    const xi=TVX.findIndex(x=>x[0]===t.market.identifier);if(xi<0)return;
    const b=String(t.base||'').toUpperCase(),q=String(t.target||'').toUpperCase(),qi=TVQ.indexOf(q);
    if(qi<0||b!==c.sym||!/^[A-Z0-9]{1,15}$/.test(b))return;
    const sc=xi*10+qi;if(sc<bs){bs=sc;best=TVX[xi][1]+':'+b+q;}
  });
  return best;
}

const RGL=['Semua'].concat(Array.from({length:10},(_,i)=>(i*1000+1)+'–'+((i+1)*1000)));
const rgm=$('rgm'),rgb=$('rg');
rgm.innerHTML=RGL.map((t,i)=>'<button type="button" data-v="'+(i-1)+'"'+(i===0?' class="on"':'')+'>'+t+'</button>').join('');
function rgClose(){rgm.style.display='none';rgb.classList.remove('open');}
function rgOpen(){const r=rgb.getBoundingClientRect();rgm.style.top=(r.bottom+6)+'px';rgm.style.right=Math.max(6,window.innerWidth-r.right)+'px';rgm.style.display='block';rgb.classList.add('open');}
rgb.addEventListener('click',e=>{e.stopPropagation();rgm.style.display==='block'?rgClose():rgOpen();});
document.addEventListener('pointerdown',e=>{if(rgm.style.display==='block'&&!e.target.closest('#rgm,#rg'))rgClose();},true);
/* pas-kan seluruh kumpulan bola ke layar (kecil, utuh satu halaman) */
function fitAll(ms){
  if(!list.length||!W){animTo(KMIN,WS/2,WS/2,ms);return;}
  let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;
  for(const c of list){const r=c.tr,x=c.tx,y=c.ty;if(x-r<x0)x0=x-r;if(x+r>x1)x1=x+r;if(y-r<y0)y0=y-r;if(y+r>y1)y1=y+r;}
  const bw=Math.max(1,x1-x0),bh=Math.max(1,y1-y0);
  animTo(clamp(Math.min(W/bw,H/bh)*.96,KMIN,MAXK),(x0+x1)/2,(y0+y1)/2,ms);
}
rgm.addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;
  const v=+b.dataset.v;rng=v<0?null:v;
  $('rgT').textContent=RGL[v+1];
  [...rgm.children].forEach(x=>x.classList.toggle('on',x===b));
  rgClose();
  coins.forEach(c=>{c.free=false;c.vx=c.vy=0;});
  if(selected)hideInfo();
  anim=null;inert=false;
  relayout(()=>{fitAll(500);});
  refreshUI();
});
$('seg').addEventListener('pointerdown',e=>{
  const b=e.target.closest('button');if(!b||b.dataset.s===sortBy)return;e.preventDefault();
  sortBy=b.dataset.s;[...$('seg').children].forEach(x=>x.classList.toggle('on',x===b));renderTop();   /* sorot tombol seketika */
  coins.forEach(c=>{c.free=false;c.vx=c.vy=0;});
  setTimeout(()=>{relayout();refreshUI();},0);
});

/* ====== ZOOM / GESER ala Google Earth di dunia 10.000 x 10.000 ====== */
let KMIN=.03,K0=.2,viewInit=false,zlTxt='',svT=0;
function lim(size){const w=WS*view.k;return w<=size?[(size-w)/2,(size-w)/2]:[size-w,0];}
function saveView(){
  clearTimeout(svT);
  svT=setTimeout(()=>{try{localStorage.setItem('cp_view2',JSON.stringify({k:view.k,cx:(W/2-view.x)/view.k,cy:(H/2-view.y)/view.k}));}catch(e){}},600);
}
function clampView(){
  viewT=performance.now();
  view.k=clamp(view.k,KMIN,MAXK);
  const lx=lim(W),ly=lim(H);
  view.x=clamp(view.x,lx[0],lx[1]);view.y=clamp(view.y,ly[0],ly[1]);
  const z='×'+(view.k/K0).toFixed(view.k/K0<10?1:0);
  if(z!==zlTxt){zlTxt=z;$('zl').textContent=z;}
  saveView();
}
function zoomAt(cx,cy,nk){nk=clamp(nk,KMIN,MAXK);const wx=(cx-view.x)/view.k,wy=(cy-view.y)/view.k;view.k=nk;view.x=cx-wx*nk;view.y=cy-wy*nk;clampView();}
let inert=false,ivx=0,ivy=0,anim=null;
function animTo(k1,cx1,cy1,ms){
  inert=false;
  anim={t0:performance.now(),ms:ms||260,k0:view.k,k1:clamp(k1,KMIN,MAXK),cx0:(W/2-view.x)/view.k,cy0:(H/2-view.y)/view.k,cx1:cx1,cy1:cy1};
}
function motion(dt){
  if(anim){
    const p=clamp((performance.now()-anim.t0)/anim.ms,0,1),e=1-Math.pow(1-p,3);
    const k=anim.k0*Math.pow(anim.k1/anim.k0,e),cx=anim.cx0+(anim.cx1-anim.cx0)*e,cy=anim.cy0+(anim.cy1-anim.cy0)*e;
    view.k=k;view.x=W/2-cx*k;view.y=H/2-cy*k;clampView();
    if(p>=1)anim=null;
  }else if(inert){
    const lx=lim(W),ly=lim(H);
    const tx=view.x+ivx*dt,ty=view.y+ivy*dt;
    const nx=clamp(tx,lx[0],lx[1]),ny=clamp(ty,ly[0],ly[1]);
    if(nx!==tx)ivx=0;if(ny!==ty)ivy=0;
    view.x=nx;view.y=ny;clampView();
    const f=Math.pow(.93,dt);ivx*=f;ivy*=f;
    if(Math.hypot(ivx,ivy)<.15)inert=false;
  }
}
const ctrC=()=>[(W/2-view.x)/view.k,(H/2-view.y)/view.k];
const fast=(id,fn)=>$(id).addEventListener('pointerdown',e=>{e.preventDefault();e.stopPropagation();fn();});
fast('zi',()=>{const c=ctrC();animTo(view.k*2,c[0],c[1],170);});
fast('zo',()=>{const c=ctrC();animTo(view.k/2,c[0],c[1],170);});
fast('reset',()=>animTo(K0,WS/2,WS/2,500));
cv.addEventListener('wheel',e=>{
  e.preventDefault();anim=null;inert=false;
  const d=e.deltaMode===1?e.deltaY*33:e.deltaY;
  zoomAt(e.offsetX,e.offsetY,view.k*Math.exp(-d*(e.ctrlKey?.01:.0018)));
},{passive:false});
const ptrs=new Map();let drag=null,pinch=null,moved=0,gest=false;
let held=null,hoff=null,hist=[],holdMoved=false,sx=0,sy=0,pend=null,holdTimer=0,vh=[];
const pd=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
const toW=(px,py)=>({x:(px-view.x)/view.k,y:(py-view.y)/view.k});
function hit(px,py){
  const w=toW(px,py);let best=null,bs=1e9;
  for(const c of list){if(flt&&cls(c)!==flt)continue;const rr=Math.max(c.r,7/view.k),d=Math.hypot(c.x-w.x,c.y-w.y);if(d<=rr){const sc=d/rr;if(sc<bs){bs=sc;best=c;}}}
  return best;
}
cv.addEventListener('pointerdown',e=>{
  cv.setPointerCapture(e.pointerId);ptrs.set(e.pointerId,{x:e.offsetX,y:e.offsetY});
  inert=false;anim=null;
  if(ptrs.size===1){
    moved=0;gest=false;holdMoved=false;sx=e.offsetX;sy=e.offsetY;held=null;pend=null;clearTimeout(holdTimer);
    drag={x:e.offsetX,y:e.offsetY,vx:view.x,vy:view.y};
    vh=[{t:performance.now(),x:e.offsetX,y:e.offsetY}];
    if($('info').style.display!=='block'){
      const b=hit(e.offsetX,e.offsetY);
      /* tahan ~0,4 dtk di atas gelembung lalu seret = pegang & lempar gelembung; geser cepat = geser peta */
      if(b){pend=b;holdTimer=setTimeout(()=>{
        if(pend&&moved<6&&ptrs.size===1){
          held=pend;pend=null;drag=null;
          const w=toW(sx,sy);hoff={x:held.x-w.x,y:held.y-w.y};hist=[{t:performance.now(),x:w.x,y:w.y}];
          try{if(navigator.vibrate)navigator.vibrate(12);}catch(_){}
        }
      },380);}
    }
  }else if(ptrs.size===2){
    gest=true;drag=null;held=null;pend=null;clearTimeout(holdTimer);
    const [a,b]=[...ptrs.values()],mx=(a.x+b.x)/2,my=(a.y+b.y)/2;
    pinch={d:pd(a,b),k:view.k,wx:(mx-view.x)/view.k,wy:(my-view.y)/view.k};
  }
});
cv.addEventListener('pointermove',e=>{
  if(!ptrs.has(e.pointerId))return;ptrs.set(e.pointerId,{x:e.offsetX,y:e.offsetY});
  if(ptrs.size===2&&pinch){
    const [a,b]=[...ptrs.values()],mx=(a.x+b.x)/2,my=(a.y+b.y)/2;
    const nk=clamp(pinch.k*pd(a,b)/pinch.d,KMIN,MAXK);
    view.k=nk;view.x=mx-pinch.wx*nk;view.y=my-pinch.wy*nk;clampView();
  }
  else if(held){
    moved=Math.max(moved,Math.hypot(e.offsetX-sx,e.offsetY-sy));
    if(moved>=6){
      holdMoved=true;held.free=true;wake(held);
      const w=toW(e.offsetX,e.offsetY),now=performance.now();
      held.x=clamp(w.x+hoff.x,held.r,WS-held.r);held.y=clamp(w.y+hoff.y,held.r,WS-held.r);
      hist.push({t:now,x:w.x,y:w.y});while(hist.length>2&&now-hist[0].t>100)hist.shift();
      if(hist.length>=2){const f=hist[0],l=hist[hist.length-1],dt=Math.max(8,l.t-f.t);held.vx=(l.x-f.x)/dt*16.7;held.vy=(l.y-f.y)/dt*16.7;}
    }
  }
  else if(drag){
    moved=Math.max(moved,Math.hypot(e.offsetX-sx,e.offsetY-sy));
    if(moved>=6&&pend){pend=null;clearTimeout(holdTimer);}
    view.x=drag.vx+(e.offsetX-drag.x);view.y=drag.vy+(e.offsetY-drag.y);clampView();
    const now=performance.now();vh.push({t:now,x:e.offsetX,y:e.offsetY});while(vh.length>2&&now-vh[0].t>100)vh.shift();
  }
});
function up(e){
  if(!ptrs.has(e.pointerId))return;
  const wasTap=ptrs.size===1&&!gest&&moved<8&&e.type==='pointerup';
  ptrs.delete(e.pointerId);clearTimeout(holdTimer);
  if(held){
    const b=held;held=null;
    if(holdMoved){
      let vx=0,vy=0;const now=performance.now();
      if(hist.length>=2&&now-hist[hist.length-1].t<90){const f=hist[0],l=hist[hist.length-1],dt=Math.max(8,l.t-f.t);vx=(l.x-f.x)/dt*16.7;vy=(l.y-f.y)/dt*16.7;}
      const sp=Math.hypot(vx,vy),mx=45;if(sp>mx){vx*=mx/sp;vy*=mx/sp;}
      b.vx=vx;b.vy=vy;b.free=true;b.st=0;wake(b);
    }else if(wasTap)tap(e.offsetX,e.offsetY);
  }else if(wasTap)tap(e.offsetX,e.offsetY);
  else if(drag&&!gest&&ptrs.size===0&&e.type==='pointerup'){
    const now=performance.now();
    if(vh.length>=2&&now-vh[vh.length-1].t<80){
      const f=vh[0],l=vh[vh.length-1],d=Math.max(8,l.t-f.t);
      ivx=(l.x-f.x)/d*16.7;ivy=(l.y-f.y)/d*16.7;
      if(Math.hypot(ivx,ivy)>1.5)inert=true;
    }
  }
  pend=null;
  if(ptrs.size<2)pinch=null;
  if(ptrs.size===1&&!held){const p=[...ptrs.values()][0];drag={x:p.x,y:p.y,vx:view.x,vy:view.y};vh=[{t:performance.now(),x:p.x,y:p.y}];}else drag=null;
}
cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',up);
function tap(px,py){
  if($('info').style.display==='block')return;
  const b=hit(px,py);b?showInfo(b):hideInfo();
}

/* ====== FISIKA: tahan & lempar gelembung ====== */
function physics(dt){
  if(!act.length)return;
  const hm=h=>h===held&&holdMoved;
  let w=0,tw=false,te=1;
  if(trans){
    tw=true;const p=clamp((performance.now()-trans.t0)/trans.ms,0,1);
    te=p<.5?4*p*p*p:1-Math.pow(-2*p+2,3)/2;   /* easeInOutCubic: mulai & berhenti lembut */
    if(p>=1){trans=null;needBuild=true;layerDirty=true;}
  }
  for(let i=0;i<act.length;i++){
    const c=act[i];
    if(tw&&!c.free&&!hm(c)){c.r=c.f0+(c.tr-c.f0)*te;c.x=c.fx+(c.tx-c.fx)*te;c.y=c.fy+(c.ty-c.fy)*te;act[w++]=c;continue;}
    c.r+=(c.tr-c.r)*.16;
    let keep=Math.abs(c.tr-c.r)>.02;
    if(hm(c)){const f=Math.pow(.8,dt);c.vx*=f;c.vy*=f;act[w++]=c;continue;}
    if(c.free){
      c.x+=c.vx*dt;c.y+=c.vy*dt;const f=Math.pow(.985,dt);c.vx*=f;c.vy*=f;keep=true;
      if(c.x<c.r){c.x=c.r;c.vx=Math.abs(c.vx)*.8;}else if(c.x>WS-c.r){c.x=WS-c.r;c.vx=-Math.abs(c.vx)*.8;}
      if(c.y<c.r){c.y=c.r;c.vy=Math.abs(c.vy)*.8;}else if(c.y>WS-c.r){c.y=WS-c.r;c.vy=-Math.abs(c.vy)*.8;}
    }else{
      c.x+=(c.tx-c.x)*.16;c.y+=(c.ty-c.y)*.16;
      if(Math.abs(c.tx-c.x)>.03||Math.abs(c.ty-c.y)>.03)keep=true;else{c.x=c.tx;c.y=c.ty;}
    }
    if(keep)act[w++]=c;else c.aw=false;
  }
  act.length=w;
  const n=list.length;
  for(let ai=0;ai<act.length;ai++){
    const a=act[ai],aAct=a.free||hm(a);if(!aAct)continue;const i=a.li;
    for(let j=0;j<n;j++){
      if(j===i)continue;const b=list[j];if(flt&&cls(b)!==flt)continue;const bAct=b.free||hm(b);
      if(bAct&&j<i)continue;
      const dx=b.x-a.x,dy=b.y-a.y,m=a.r+b.r;
      if(Math.abs(dx)>m||Math.abs(dy)>m)continue;
      const d=Math.hypot(dx,dy);if(d>=m||d<.001)continue;
      const nx=dx/d,ny=dy/d,o=m-d;
      const ia=hm(a)?0:1/(a.r*a.r),ib=hm(b)?0:1/(b.r*b.r),is=ia+ib;if(!is)continue;
      a.x-=nx*o*ia/is;a.y-=ny*o*ia/is;b.x+=nx*o*ib/is;b.y+=ny*o*ib/is;
      const vn=(b.vx-a.vx)*nx+(b.vy-a.vy)*ny;
      if(vn<0){const jj=-(1+.7)*vn/is;a.vx-=jj*ia*nx;a.vy-=jj*ia*ny;b.vx+=jj*ib*nx;b.vy+=jj*ib*ny;}
      if(!b.free&&!hm(b)){b.free=true;b.st=0;wake(b);}
      if(!a.free&&!hm(a)){a.free=true;a.st=0;wake(a);}
    }
  }
  for(let ai=0;ai<act.length;ai++){
    const c=act[ai];if(!c.free||hm(c))continue;
    if(Math.hypot(c.vx,c.vy)<.08){if(++c.st>25){c.free=false;layerDirty=true;c.tx=clamp(c.x,c.tr+1,WS-c.tr-1);c.ty=clamp(c.y,c.tr+1,WS-c.tr-1);c.vx=c.vy=0;}}
    else c.st=0;
  }
}

/* ====== RESIZE ====== */
function resize(){
  const w=stage.clientWidth,h=stage.clientHeight;if(!w||!h)return;
  if(w===W&&h===H)return;
  mmK=-1;W=w;H=h;cv.width=Math.round(W*DPR);cv.height=Math.round(H*DPR);
  KMIN=Math.min(W,H)/WS;K0=clamp(W/2200,KMIN,MAXK);
  if(!viewInit){
    viewInit=true;let v=null;
    try{v=JSON.parse(localStorage.getItem('cp_view2')||'null');}catch(e){}
    if(v&&isFinite(v.k)&&isFinite(v.cx)&&isFinite(v.cy)){view.k=v.k;view.x=W/2-v.cx*v.k;view.y=H/2-v.cy*v.k;}
    else{view.k=K0;view.x=W/2-WS/2*K0;view.y=H/2-WS/2*K0;}
  }
  clampView();
}
let rt;new ResizeObserver(()=>{clearTimeout(rt);rt=setTimeout(resize,120);}).observe(stage);

/* ====== START: cache lengkap (data + logo teratas + posisi layar) -> semua koin langsung muncul sekaligus ====== */
(async function boot(){
  resize();
  requestAnimationFrame(frame);
  await DB.open();
  try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist();}catch(e){}
  let cached=await DB.get('data');
  if(!cached||!cached.d||!cached.d.length){cached=null;try{cached=JSON.parse(localStorage.getItem('cg_cache1')||'null');}catch(e){}}
  if(cached&&cached.d&&cached.d.length){
    ingest(cached.d);lastT=cached.t||0;demo=false;
    const age=Date.now()-lastT;
    if(cached.done&&age<FRESH_MS){fullDone=true;}
    else if(!cached.done&&age<FRESH_MS){fullNext=cached.next||1;}
    else{fullNext=1;fullDone=false;}   /* cache lama: sapuan penuh diam-diam di latar belakang */
    refreshUI();
    if(cached.done){
      reveal(()=>{kickLogos();warmPush(coins);});   /* cache ada: langsung tampil, tanpa layar loading */
    }else setProg('Melanjutkan muat…',(fullNext-1)/PAGES*100);
  }else setProg('Memuat 0%',0,'Pertama kali: mengunduh 10.000 koin, selanjutnya langsung tampil dari cache');
  load();startWorker();setInterval(warmPump,600);
  setInterval(()=>{if(!document.hidden)load();},REFRESH_MS);
  document.addEventListener('visibilitychange',()=>{if(!document.hidden&&Date.now()-lastT>REFRESH_MS)load();});
})();
})();
